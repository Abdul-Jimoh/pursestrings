# Deploy from the repo root: fly deploy . --config apps/range/fly.toml --ha=false
# Secrets (never in this file): fly secrets set RANGE_AGENT_KEY=... RANGE_MODEL_KEY=... SHOP_AGENT_KEY=...
# Optional secrets: PROVER_ACCOUNT / PROVER_KEY (a funded account that proves Base payments and
# sweeps expired quotes), TRY_BUYER_ACCOUNT / TRY_BUYER_KEY (the demo buyer for "try it without a
# wallet": a full-access key, since paying attaches a deposit; keep only a few testnet NEAR there).
# SHOP_TRY_PER_DAY caps demo checks (default 20; a value that isn't a number allows none).
app = "pursestrings-range"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NEAR_RPC = "https://test.rpc.fastnear.com"
  RANGE_ACCOUNT = "range.factory.ps-spike-1028.testnet"
  RANGE_OURS = "ps-funder-1101.testnet,0x9d7ac751235b819991b3050d3f19e58a8e66ae03"
  RANGE_ORIGIN = "https://pursestrings.site,https://www.pursestrings.site"
  RANGE_DAILY_USD = "1"
  RANGE_PER_HOUR = "5"
  SHOP_ACCOUNT = "shop.factory.ps-spike-1028.testnet"
  BOARD_ACCOUNT = "board.factory.ps-spike-1028.testnet"
  SHOP_COSTS_TO = "ps-spike-1028.testnet"
  SHOP_COSTS_EVM = "84532:0x036cbd53842c5426634e7929541ec2318f3dcf7e:0x9d7ac751235b819991b3050d3f19e58a8e66ae03"
  EVM_RPC_84532 = "https://sepolia.base.org"

# The attack log is an append-only file, so it lives on a volume.
[[mounts]]
  source = "range_data"
  destination = "/data"

# One machine (deploy with --ha=false), always on. To save money later, set auto_stop_machines
# to "stop" and min_machines_running to 0: the daily model cap and per-account limits are
# rebuilt from the log on start, but sign-in sessions are in memory.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

  [[http_service.checks]]
    method = "GET"
    path = "/api/status"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
